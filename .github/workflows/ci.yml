name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: stable

jobs:
  checks:
    name: Build and test
    # FFmpeg 8 supports the HLS input options used by the download smoke tests.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg mpv

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          ffmpeg -version
          ffprobe -version
          mpv --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Check history migration and CLI compatibility
        run: python3 tests/rename_smoke.py target/release/miru

      - name: Check playback and downloads
        run: python3 tests/smoke.py target/release/miru

      - name: Check terminal lifecycle
        run: python3 tests/terminal_smoke.py target/release/miru

      - name: Check navigation and queue ownership
        run: python3 tests/navigation_smoke.py target/release/miru

      - name: Check theme behavior
        run: python3 tests/theme_smoke.py target/release/miru
