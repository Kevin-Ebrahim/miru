name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: stable

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Install process test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          bwrap --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run unit tests
        run: cargo test --locked

      - name: Build test binary
        run: cargo build --locked

      - name: Check CLI, storage and terminal behavior
        run: |
          status=0
          for suite in rename cli output storage parser jobs terminal theme; do
            echo "::group::${suite} smoke test"
            if ! python3 "tests/${suite}_smoke.py" target/debug/miru; then
              echo "::error::${suite} smoke test failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
