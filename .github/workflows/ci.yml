name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Rust 1.90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mpv
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run unit tests
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Test migration and command-line settings
        run: python3 tests/rename_smoke.py target/release/miru
      - name: Test playback and downloads with local fixtures
        run: python3 tests/smoke.py target/release/miru
      - name: Test terminal restoration and animation
        run: python3 tests/terminal_smoke.py target/release/miru
      - name: Test navigation and queues
        run: python3 tests/navigation_smoke.py target/release/miru
      - name: Test themes
        run: python3 tests/theme_smoke.py target/release/miru
